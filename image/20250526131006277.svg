<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000px" height="600px" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 箭头直接用多边形，避免 marker 兼容性问题 -->
  <polygon id="arrow" points="0,0 10,5 0,10" fill="#555"/>
  <polygon id="arrow-blue" points="0,0 10,5 0,10" fill="#3771c8"/>
  <polygon id="arrow-green" points="0,0 10,5 0,10" fill="#2a8f4d"/>
  <!-- 背景 -->
  <rect width="1000" height="600" fill="#f9f9f9"/>
  <!-- 标题 -->
  <text x="500" y="40" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">.Onion 服务连接原理图</text>
  <!-- 客户端 -->
  <rect x="50" y="150" width="120" height="80" rx="10" fill="#e6f2ff" stroke="#3771c8" stroke-width="2"/>
  <text x="110" y="195" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">客户端</text>
  <text x="110" y="215" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">(Tor 浏览器)</text>
  <!-- DHT -->
  <rect x="400" y="50" width="200" height="80" rx="10" fill="#fff0d9" stroke="#ff9900" stroke-width="2"/>
  <text x="500" y="90" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">分布式哈希表 (DHT)</text>
  <text x="500" y="110" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">存储服务描述符</text>
  <!-- 引入点 -->
  <rect x="300" y="200" width="120" height="80" rx="10" fill="#e6ffe6" stroke="#2a8f4d" stroke-width="2"/>
  <text x="360" y="245" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">引入点</text>
  <text x="360" y="265" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">(Introduction Points)</text>
  <!-- 汇合点 -->
  <rect x="500" y="300" width="120" height="80" rx="10" fill="#f0e6ff" stroke="#6a3bc8" stroke-width="2"/>
  <text x="560" y="345" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">汇合点</text>
  <text x="560" y="365" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">(Rendezvous Point)</text>
  <!-- .onion服务 -->
  <rect x="800" y="150" width="120" height="80" rx="10" fill="#ffe6e6" stroke="#c83737" stroke-width="2"/>
  <text x="860" y="195" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">.onion 服务</text>
  <text x="860" y="215" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">(隐藏服务器)</text>
  <!-- 连接线（用简单line/path，箭头用多边形叠加） -->
  <line x1="120" y1="150" x2="400" y2="90" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,3"/>
  <use href="#arrow" x="400" y="90" transform="rotate(-12 400 90)"/>
  <text x="220" y="100" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" fill="#ff9900">1. 查询服务描述符</text>
  <line x1="400" y1="110" x2="170" y2="150" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,3"/>
  <use href="#arrow" x="170" y="150" transform="rotate(10 170 150)"/>
  <text x="270" y="140" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" fill="#ff9900">2. 返回描述符(含引入点)</text>
  <line x1="800" y1="150" x2="600" y2="90" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,3"/>
  <use href="#arrow" x="600" y="90" transform="rotate(-20 600 90)"/>
  <text x="730" y="100" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" fill="#ff9900">0. 发布服务描述符</text>
  <!-- 其余曲线连接建议在AI中手动画出，SVG曲线兼容性有限 -->
  <!-- 说明区块 -->
  <rect x="50" y="480" width="900" height="70" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
  <text x="500" y="500" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">完整的 Tor 线路: 客户端 → 3跳 → 汇合点 ← 3跳 ← .onion服务</text>
  <text x="500" y="525" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">双向匿名、端到端加密的连接 (总共6跳)</text>
  <text x="500" y="545" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">客户端和服务端都不知道对方的真实IP地址</text>
  <!-- DHT 说明 -->
  <rect x="700" y="50" width="250" height="70" rx="5" fill="#fff9e6" stroke="#ff9900" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="825" y="75" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#ff9900" font-weight="bold">DHT的作用:</text>
  <text x="825" y="95" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#666">• 分布式存储服务描述符</text>
  <text x="825" y="115" font-family="SimSun, 'Microsoft YaHei', Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#666">• 使客户端能够找到引入点而无需知道服务器IP</text>
</svg> 